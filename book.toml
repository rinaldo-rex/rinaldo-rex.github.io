[book]
title = "Rinaldo's Stream of Consciousness"
authors = ["Rinaldo Rex"]
language = "en"

[output.html.fold]
enable = true    # include support for printable output
level = 2

[output.html]
no-section-label = true
mathjax-support = true
sidebar-header-nav = false

[preprocessor.footnote]

[preprocessor.reading-time]
words-per-minute = 150

[preprocessor.gitinfo]
enable = false

# choose placement(s)
header = false   # default: false
footer = true    # default: true
align.footer = "right"
margin.footer = ["3em", "0", "0", "0"]

# common formatting
font-size   = "0.9em"
separator   = " • "
date-format = "%Y %B %d"
time-format = "| %I:%M %p"
branch      = "master"
hyperlink   = true  # make hash/branch clickable when possible

# optional timezone handling
timezone = "local"   # "local" (default) | "utc" | "source" | "fixed:+02:00"

[preprocessor.gitinfo.message]
footer = '<span style="color:#568262"> Last updated: <em>{{last-updated}}</em> </span>'

[preprocessor.inplace-note]
popover-font-size = "80%"
trigger-hit-padding = "3px"
popover-max-width = "30vw"
popover-min-width = "100%"
popover-width = "max-content"



[preprocessor.timeline]
after = [ "inplace-note" ]

[preprocessor.last-updated]
short = true
superscript = true

[build]
build-dir = "book"

[preprocessor.util-banner]
command = "mdutils"
position = "right"
sticky = true

[preprocessor.util-private-page]
command = "mdutils"
hide_sidebar = true
hide_nav_buttons = true
